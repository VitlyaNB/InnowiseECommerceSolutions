version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop_app
    ports:
      - "8000:8000" # Порт для Laravel (API)
      - "5173:5173" # Порт для Vite (React HMR)
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: shop_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: shop_db
      MYSQL_ROOT_PASSWORD: pass
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
