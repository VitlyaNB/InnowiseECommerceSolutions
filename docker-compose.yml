version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shop_app
    networks:
      - default
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - minio
      - elasticsearch
    environment:
      - AWS_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_BUCKET=shop
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    expose:
      - "9000"

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shop_worker
    networks:
      - default
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - minio
      - elasticsearch
    command: sh -c "composer install && php artisan queue:work --tries=1 --timeout=0"

  vite:
    image: node:21-alpine
    container_name: shop_vite
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: npm run dev -- --host
    depends_on:
      - app

  nginx:
    image: nginx:alpine
    container_name: shop_nginx
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - default

  db:
    image: mysql:8.0
    container_name: shop_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: shop_db
      MYSQL_ROOT_PASSWORD: pass
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init-test-db.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  minio:
    image: minio/minio:latest
    container_name: shop_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: shop_elastic
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data

volumes:
  db_data:
  minio_data:
  elastic_data:
